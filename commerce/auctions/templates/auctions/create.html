{% extends "auctions/layout.html" %}

{% block body %}
    <h2>Create New Listing</h2>

    <form action="{% url 'create' %}" method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" name="title" class="form-control" id="title" placeholder="Enter Title">
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <input type="text" name="description" class="form-control" id="description" placeholder="Enter Description">
        </div>
        <div class="mb-3">
            <label for="imageUrl" class="form-label">ImageURL</label>
            <input type="text" name="imageUrl" class="form-control" id="imageUrl" placeholder="Enter ImageURL">
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <input type="number" name="price" class="form-control" min="0" id="price" placeholder="Enter Price">
        </div>
        <div class="form-group">
            <label for="category">Choose a Category:</label>
            <select name="category" id="category">
                <option selected disabled>Select One</option>
                {% for category in categories %}
                    <option value="{{ category }}">{{ category }}</option>
                {% endfor %}
            </select>
          </div>
        <button type="submit" class="btn btn-primary">Create New Listing</button>
    </form>
{% endblock %}
