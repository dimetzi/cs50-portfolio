{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <form action="/register" method="post">
        <div class="mb-3">
            <input type="text" autofocus class="form-control mx-auto w-auto" name="username" placeholder="Username" autofocus autocomplete="off" id="username">
        </div>
        <div class="mb-3">
            <input type="password" autofocus class="form-control mx-auto w-auto" name="password" placeholder="Password" autocomplete="off" id="password">
        </div>
        <div class="mb-3">
            <input type="password" autofocus class="form-control mx-auto w-auto" name="confirmation" placeholder="Confirm Password" autocomplete="off" id="password">
        </div>
        <button class="btn btn-primary" type="submit">Register</button>
    </form>
{% endblock %}
