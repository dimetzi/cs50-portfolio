{% extends "layout.html" %}

{% block title %}
    Home
{% endblock %}

{% block main %}
    <h1>Welcome To My Page</h1>
    <br><br>
    <div class="card-group"></div>
    {% for movie in movies %}
        <h2>{{ movie.title }}</h2>
        <img src={{ movie.image }} class="img">
        <button class="btn btn-warning"><a href={{ movie.url}}>Watch now</a></button>
    {% endfor %}
</div>

{% endblock %}
