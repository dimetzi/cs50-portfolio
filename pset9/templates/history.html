{% extends "layout.html" %}

{% block title %}
    History
{% endblock %}

{% block main %}
    <main class="container py-5 text-center">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Shares</th>
                    <th>Price</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                {% for row in transactions %}
                    <tr>
                        <td class="border-1">{{ row["symbol"] }}</td>
                        <td class="border-1">{{ row["shares"] }}</td>
                        <td class="border-1">{{ row["price"] | usd }}</td>
                        <td class="border-1">{{ row["date"] }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
{% endblock %}
