{% extends "layout.html" %}

{% block title %}
    Portfolio
{% endblock %}

{% block main %}
    <main class="container py-5 text-center">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Shares</th>
                    <th>Price</th>
                    <th>TOTAL</th>
                </tr>
            </thead>
            <tbody>
                {% for row in database %}
                    <tr>
                        <td class="border-1">{{ row["symbol"] }}</td>
                        <td class="border-1">{{ row["shares"] }}</td>
                        <td class="border-1">{{ row["price"] |usd }}</td>
                    </tr>
                {% endfor %}
            </tbody>
            <tfoot>
                <tr>
                    <td></td>
                    <td></td>
                    <td class="border-1 fw-bold">Cash</td>
                    <td class="border-1 fw-bold">{{ cash | usd }}</td>
                </tr>
            </tfoot>
        </table>
{% endblock %}
