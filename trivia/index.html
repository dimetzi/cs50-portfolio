<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            // TODO: Add code to check answers to questions
            document.addEventListener('DOMContentLoaded', function() {

                let correct = document.querySelector('.correct');
                correct.addEventListener('click', function() {
                    correct.style.backgroundColor = "green";
                    document.querySelector("#answer1").innerHTML = "Correct!";
                });
            });
            document.addEventListener('DOMContentLoaded', function() {
                let incorrects = document.querySelector('.incorrect');
                incorrects.addEventListener('click', function() {
                    incorrects.style.backgroundColor = "red";
                    document.querySelector("#answer1").innerHTML = "Incorrect!";
                    });
            });

            document.addEventListener('DOMContentLoaded', function() {
                let incorrects = document.querySelector('.incorrecto');
                incorrects.addEventListener('click', function() {
                    incorrects.style.backgroundColor = "red";
                    document.querySelector("#answer1").innerHTML = "Incorrect!";
                    });
            });

            document.addEventListener('DOMContentLoaded', function() {
                let incorrects = document.querySelector('.incorrectoo');
                incorrects.addEventListener('click', function() {
                    incorrects.style.backgroundColor = "red";
                    document.querySelector("#answer1").innerHTML = "Incorrect!";
                    });
            });

            document.addEventListener('DOMContentLoaded', function() {
                document.querySelector("#check").addEventListener('click', function() {
                    let input = document.querySelector('input');
                    if (input.value == 'Messi') {
                        input.style.backgroundColor = "green";
                        document.querySelector('#answer2').innerHTML = "Correct!";
                    } else {
                        input.style.backgroundColor = "red";
                        document.querySelector('#answer2').innerHTML = "Incorrect!";
                    }
                });
            });
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <!-- TODO: Add multiple choice question here -->
                <h3>What is the capital of Greece?</h3>
                <button class="incorrect">Thessaloniki</button>
                <button class="incorrecto">Kavala</button>
                <button class="incorrectoo">Patra</button>
                <button class="correct">Athens</button>

                <p id="answer1"></p>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <!-- TODO: Add free response question here -->
                <h3>Who is the best football player of all time?</h3>
                <input type="text"></input>
                <button id="check">Check Answer</button>

                <p id="answer2"></p>

            </div>
        </div>
    </body>
</html>
